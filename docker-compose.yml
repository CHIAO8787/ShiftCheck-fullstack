services:
  postgres:
    image: postgres:16
    container_name: shiftcheck-postgres
    environment:
      POSTGRES_DB: shiftcheck
      POSTGRES_USER: shiftcheck
      POSTGRES_PASSWORD: shiftcheck_dev_password
    ports: ["5432:5432"]
    volumes: [shiftcheck_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftcheck -d shiftcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  shiftcheck_pgdata:
